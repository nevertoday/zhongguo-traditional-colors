name: verify

# Guards the project's single source of truth and its generated artifacts.
# The repo commits all generated output (color pages, harmonies, share cards,
# the README, the on-site source preview) directly, so a contributor who edits
# a source file but forgets to re-run the build would silently ship stale
# artifacts. This workflow rebuilds the deterministic outputs and fails if any
# of them drift from what was committed.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. The manifest must join cleanly to the canonical color list
      #    (contiguous stable ids, no null/invalid hex, name+cmyk agreement).
      - name: Verify manifest join
        run: npm run verify:manifest

      # 2. Rebuild every generated artifact from source, then fail if the working
      #    tree drifted. images.js is now a pure function of its inputs (no
      #    timestamp), so it is rebuilt and diffed like everything else — this
      #    also catches a committed images.js that is stale vs the images/ dir.
      - name: Rebuild generated artifacts
        run: |
          npm run manifest
          npm run harmonies
          npm run harmony:uses
          npm run colorpages
          npm run preview:syntax
          npm run readme

      # `git add -A` then `git diff --cached --exit-code` so NEW generated files
      # (e.g. a new color's page/card) are caught too — plain `git diff` ignores
      # untracked files and would pass green on a missing committed artifact.
      - name: Fail on uncommitted artifact drift
        run: |
          git add -A
          if ! git diff --cached --exit-code; then
            echo "::error::Generated artifacts are out of date or uncommitted. Run 'npm run prepare:release' and commit the result."
            exit 1
          fi

      # 3. Validate the artifacts themselves (SEO pages, terminal palette, harmony).
      - name: Verify artifacts
        run: |
          npm run verify:colorpages
          npm run terminal:audit
          npm run harmony:audit
