      const hexToRgb = (h) => { h = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); };
      function rgbToCmyk(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const k = 1 - Math.max(r, g, b);
        if (k === 1) return [0, 0, 0, 100];
        return [(1 - r - k) / (1 - k), (1 - g - k) / (1 - k), (1 - b - k) / (1 - k), k].map((v) => Math.round(v * 100));
      }
      function relLum(hex) {
        const [r, g, b] = hexToRgb(hex).map((v) => {
          v /= 255;
          return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      }
      const INK_DARK = '#1a1a1a';
      const INK_LIGHT = '#ffffff';
      const DARK_LUM = relLum(INK_DARK);
      const contrast = (a, b) => (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
      // Pick whichever ink maximizes contrast against the color — not a luminance
      // cutoff, which on mid colors can return the weaker of the two.
      function readableOn(hex) {
        const L = relLum(hex);
        return contrast(L, 1) >= contrast(L, DARK_LUM) ? INK_LIGHT : INK_DARK;
      }

      const card = document.getElementById('card');
      const live = document.getElementById('live');
      const toTheme = document.getElementById('to-theme');
      const toTerminal = document.getElementById('to-terminal');
      let lastColorId = null;
      function announceColor(c) {
        if (c.id === lastColorId) return;
        lastColorId = c.id;
        live.textContent = `已选 No.${c.id} ${c.name} ${c.hex}`;
      }

      function render() {
        const c = COLORS[state.idx];
        const [r, g, b] = hexToRgb(c.hex);
        const cmyk = rgbToCmyk(r, g, b);
        const u = usage(c);

        let bg; let ink; let showSwatch;
        if (state.mode === 'light') { bg = '#faf8f4'; ink = '#1a1a1a'; showSwatch = true; }
        else if (state.mode === 'dark') { bg = '#141310'; ink = '#efece4'; showSwatch = true; }
        else { bg = c.hex; ink = readableOn(c.hex); showSwatch = false; }

        card.dataset.fmt = state.fmt;
        card.style.background = bg;
        card.style.setProperty('--card-ink', ink);

        const swatch = showSwatch ? `<div class="card-swatch" style="background:${esc(c.hex)}"></div>` : '';
        const py = state.py ? `<div class="card-py">${esc(c.py)}</div>` : '';
        const vals = `<div class="card-vals"><span>RGB ${r} ${g} ${b}</span>${state.cmyk ? `<span>CMYK ${cmyk.join(' ')}</span>` : ''}</div>`;
        const pair = state.pair ? `<div class="card-pair"><div class="card-pair-title">配色搭档 · 取自传统色库</div><div class="card-chips">${[...c.aux, ...c.accent].slice(0, 4).map((p) => `<span class="card-chip"><span class="dot" style="background:${esc(p.hex)}"></span>${esc(p.name)}</span>`).join('')}</div></div>` : '';
        const use = state.use ? `<div class="card-use"><div><b>用对</b> ${esc(u.dos)}</div><div><b>用错</b> ${esc(u.donts)}</div></div>` : '';

        card.innerHTML = `
          <div class="card-head">中国传统色 · No.${esc(c.id)} · ${esc(c.family)} · ${esc(c.temp)}色</div>
          ${swatch}
          <div class="card-body">
            <div class="card-name">${esc(c.name)}</div>
            ${py}
            <div class="card-hex">${esc(c.hex)}</div>
            ${vals}
            ${pair}
            ${use}
          </div>
          <div class="card-foot">中国传统色 Studio · 每日一色 · colors.xiaoxiaodong.ai</div>`;
        toTheme.href = `theme-forge.html?anchor=${c.id}`;
        toTerminal.href = `terminal.html?anchor=${c.id}`;
        updatePost(c, r, g, b, cmyk, u);
        announceColor(c);
      }

      const post = document.getElementById('post');
      const tags = document.getElementById('tags');
      function updatePost(c, r, g, b, cmyk, u) {
        if (state.tone === 'art') {
          post.textContent = `【今日传统色 · ${c.name}】\n\n${c.story}\n\n色号 No.${c.id}　HEX ${c.hex}\n它属于${c.family}，${c.temp}调。\n配它好看的：${c.aux[0].name}、${c.accent[0].name}。\n\n把日子过成一幅画，从认识一个颜色开始。`;
          tags.textContent = `#中国传统色 #每日一色 #国风美学 #配色灵感 #${c.name}`;
        } else if (state.tone === 'util') {
          post.textContent = `今日配色速记 · ${c.name}（No.${c.id}）\n\nHEX ${c.hex}　RGB ${r},${g},${b}　CMYK ${cmyk.join('/')}\n用对 → ${u.dos}\n用错 → ${u.donts}\n推荐搭配：主 ${c.name} ｜ 辅 ${c.aux.map((x) => x.name).join('、')} ｜ 点缀 ${c.accent[0].name}\n\n全部 742 色 + 8904 套配色：colors.xiaoxiaodong.ai`;
          tags.textContent = '#配色 #设计素材 #UI配色 #传统色 #设计师日常';
        } else {
          post.textContent = `这个颜色，中国人用了上千年 👇\n\n${c.name}｜${c.hex}\n${c.story}\n\n谁懂啊，一个名字就是一幅画 🥹\n配上${c.accent[0].name}，国潮感拉满。\n\n收藏这套色，做封面 / 穿搭 / 家装都用得上。`;
          tags.textContent = `#国潮 #中国传统色 #宝藏配色 #高级感 #色彩美学 #${c.name}`;
        }
      }

      function bindRadioGroup(id, key) {
        const group = document.getElementById(id);
        const radios = [...group.querySelectorAll('[role="radio"]')];
        const select = (btn, focus) => {
          state[key] = btn.dataset.v;
          radios.forEach((r) => {
            const on = r === btn;
            r.setAttribute('aria-checked', String(on));
            r.tabIndex = on ? 0 : -1;
          });
          if (focus) btn.focus();
          render();
        };
        group.addEventListener('click', (e) => {
          const btn = e.target.closest('[role="radio"]');
          if (btn) select(btn, false);
        });
        group.addEventListener('keydown', (e) => {
          const i = radios.indexOf(document.activeElement);
          if (i < 0) return;
          let j;
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % radios.length;
          else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i - 1 + radios.length) % radios.length;
          else return;
          e.preventDefault();
          select(radios[j], true);
        });
      }
      bindRadioGroup('fmt', 'fmt');
      bindRadioGroup('mode', 'mode');
      bindRadioGroup('tone', 'tone');

      [['t-py', 'py'], ['t-cmyk', 'cmyk'], ['t-pair', 'pair'], ['t-use', 'use']].forEach(([id, key]) => {
        document.getElementById(id).addEventListener('change', (e) => { state[key] = e.target.checked; render(); });
      });

      const pick = document.getElementById('pick');
      COLORS.forEach((c, i) => {
        const o = document.createElement('option');
        o.value = i;
        o.textContent = `No.${c.id}　${c.name}　${c.hex}`;
        pick.appendChild(o);
      });
      pick.addEventListener('change', () => { state.idx = +pick.value; render(); });

      const step = (delta) => { state.idx = (state.idx + delta + COLORS.length) % COLORS.length; pick.value = state.idx; render(); };
      document.getElementById('prev').addEventListener('click', () => step(-1));
      document.getElementById('next').addEventListener('click', () => step(1));
      document.getElementById('rand').addEventListener('click', () => { state.idx = Math.floor(Math.random() * COLORS.length); pick.value = state.idx; render(); });

      const dateInput = document.getElementById('dateInput');
      dateInput.addEventListener('change', () => {
        if (!dateInput.value) return;
        state.idx = dayIndex(new Date(`${dateInput.value}T00:00:00`));
        pick.value = state.idx;
        render();
      });

      const PRESETS = {
        xhs: { fmt: 'portrait', mode: 'auto', tone: 'trend', py: true, cmyk: false, pair: true, use: false },
        wechat: { fmt: 'banner', mode: 'dark', tone: 'art', py: true, cmyk: false, pair: true, use: false },
        designer: { fmt: 'square', mode: 'light', tone: 'util', py: false, cmyk: true, pair: true, use: true },
      };
      document.getElementById('presets').addEventListener('click', (e) => {
        const preset = PRESETS[e.target.dataset.p];
        if (!preset) return;
        Object.assign(state, preset);
        syncControls();
        render();
      });
      function syncControls() {
        ['fmt', 'mode', 'tone'].forEach((id) => {
          document.querySelectorAll(`#${id} [role="radio"]`).forEach((b) => {
            const on = b.dataset.v === state[id];
            b.setAttribute('aria-checked', String(on));
            b.tabIndex = on ? 0 : -1;
          });
        });
        [['t-py', 'py'], ['t-cmyk', 'cmyk'], ['t-pair', 'pair'], ['t-use', 'use']].forEach(([id, key]) => {
          document.getElementById(id).checked = state[key];
        });
      }

      const copyBtn = document.getElementById('copy');
      copyBtn.addEventListener('click', () => {
        const text = `${post.textContent}\n\n${tags.textContent}`;
        navigator.clipboard.writeText(text).then(() => {
          const original = copyBtn.textContent;
          copyBtn.textContent = '已复制 ✓';
          copyBtn.disabled = true;
          live.textContent = '文案已复制到剪贴板';
          setTimeout(() => { copyBtn.textContent = original; copyBtn.disabled = false; }, 1400);
        });
      });

      const today = new Date();
      dateInput.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      state.idx = dayIndex(today);
      pick.value = state.idx;
      render();
    </script>
  </body>
</html>
